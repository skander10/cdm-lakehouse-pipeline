[project]
name = "cdm-lakehouse-pipeline"
version = "1.0.0"
description = "Lightweight Python ETL pipeline that maps raw CSV data to Microsoft CDM entities and generates a model.json manifest."
requires-python = ">=3.11"

# ---------------------------------------------------------------------------
# ruff: linter + formatter (checks style, unused imports, common bugs)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import sorting
    "B",   # flake8-bugbear (likely bugs)
    "UP",  # pyupgrade (modern Python syntax)
    "N",   # pep8-naming
]

# ---------------------------------------------------------------------------
# pytest: where the tests live and how they find the `src` package
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
